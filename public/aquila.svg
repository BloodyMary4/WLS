  </defs>
  <rect width="64" height="64" rx="10" fill="#0b0a08"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="9" fill="none" stroke="#c9a227" stroke-opacity="0.6" stroke-width="2"/>
  <!-- крылья -->
