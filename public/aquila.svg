  <path d="M20 46 q-2 6 2 10 q4 -4 2 -10 Z" fill="#2a6bb5" opacity="0.9"/>
  <path d="M44 46 q-2 6 2 10 q4 -4 2 -10 Z" fill="#2a6bb5" opacity="0.9"/>
